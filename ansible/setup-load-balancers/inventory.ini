[control_planes]
kube-control-01 ansible_host=192.168.0.93 kubernetes_role='INIT_CONTROL_NODE'
kube-control-02 ansible_host=192.168.0.94 kubernetes_role='JOIN_CONTROL_NODE'
kube-control-03 ansible_host=192.168.0.95 kubernetes_role='JOIN_CONTROL_NODE'


[load_balancers]
load-balancer-01 ansible_host=192.168.0.98 keepalived_state='MASTER' keepalived_priority=150
load-balancer-02 ansible_host=192.168.0.99 keepalived_state='BACKUP' keepalived_priority=100


[kubernetes_api_settings]
kubernetes-api vip_host=192.168.0.55 kubernetes_api_port=6443


[keepalived_settings]
keepalived-settings keepalived_interface='eth0' keepalived_virtual_router_id=51 keepalived_advert_int=1 keepalived_auth_type='PASS' keepalived_auth_pass='dev-pass'


[all:vars]
ansible_user=user
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_extra_args='-o ConnectTimeout=5 -o ConnectionAttempts=1'
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3