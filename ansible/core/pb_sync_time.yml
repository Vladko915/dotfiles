---
- hosts: core
  become: true
  gather_facts: false

  tasks:
    - name: Set timezone to Europe/Kyiv
      timezone:
        name: Europe/Kyiv

    - name: Enable NTP sync
      command: timedatectl set-ntp true

    - name: Sync time via HTTP
      shell: "date -s \"$(curl -s --head http://google.com | grep '^Date:' | sed 's/Date: //g')\""
      changed_when: false
      failed_when: false

    - name: Sync RTC to system time
      command: hwclock --systohc
      changed_when: false

    - name: Install chrony
      apt:
        name: chrony
        state: present
        update_cache: yes

    - name: Force time sync now
      shell: chronyc makestep
      changed_when: false

    - name: Allow unlimited clock steps in chrony config
      replace:
        path: /etc/chrony/chrony.conf
        regexp: '^makestep 1 3$'
        replace: 'makestep 1.0 -1'
      register: chrony_config_updated

    - name: Restart chrony if config changed
      service:
        name: chrony
        state: restarted
      when: chrony_config_updated.changed

    - name: Show current time
      command: timedatectl
      register: time_result
      changed_when: false

    - name: Show time result
      debug:
        msg: "{{ time_result.stdout }}"