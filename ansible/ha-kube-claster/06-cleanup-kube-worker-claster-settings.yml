---
- name: Cleanup previous Kubernetes cluster
  hosts: workers
  become: true
  gather_facts: false
  #serial: 1

  vars:
    kubeconfig_dir: "/home/{{ ansible_user }}/.kube"

  tasks:

    # ============================================================
    # 0. Cleanup previous Kubernetes cluster
    # ============================================================

    - name: Reset previous Kubernetes installation
      ansible.builtin.command:
        cmd: kubeadm reset -f
      register: kubeadm_reset
      changed_when: true
      failed_when: false

    - name: Stop kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
      failed_when: false

    - name: Remove CNI configuration
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: absent

    - name: Remove CNI state
      ansible.builtin.file:
        path: /var/lib/cni
        state: absent

    - name: Remove Kubernetes configuration
      ansible.builtin.file:
        path: /etc/kubernetes
        state: absent

    - name: Remove user kubeconfig
      ansible.builtin.file:
        path: "{{ kubeconfig_dir }}"
        state: absent

    # ============================================================
    # Wait for APT locks
    # ============================================================
    - name: Wait for APT locks
      ansible.builtin.shell: |
        while \
          fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
          fuser /var/cache/apt/archives/lock >/dev/null 2>&1 || \
          fuser /var/lib/apt/lists/lock >/dev/null 2>&1
        do
          sleep 5
        done
      changed_when: false

    # ============================================================
    # Cleanup APT cache
    # ============================================================

    - name: Clean APT cache
      ansible.builtin.command: apt clean
      changed_when: false